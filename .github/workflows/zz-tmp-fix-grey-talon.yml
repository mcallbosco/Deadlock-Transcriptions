name: Temporary Grey Talon transcript correction

on:
  push:
    branches:
      - codex/fix-grey-talon-transcripts-20260823

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-grey-talon-transcripts-20260823
          fetch-depth: 0

      - name: Apply supplied corrections and re-scan
        run: python tools/_tmp_fix_grey_talon_candidates.py

      - name: Commit transcript-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts
          git rm tools/_tmp_fix_grey_talon_candidates.py .github/workflows/zz-tmp-fix-grey-talon.yml
          git status --short
          git commit -m "Correct Grey Talon transcript names"
          git push origin HEAD:codex/fix-grey-talon-transcripts-20260823
