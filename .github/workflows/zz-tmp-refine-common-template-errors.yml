name: Temporary guarded transcript-error refinement

on:
  push:
    branches:
      - codex/fix-common-template-transcript-errors-20260823

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-common-template-transcript-errors-20260823
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main

      - name: Rebuild corrections with target-name guards
        run: python tools/_tmp_refine_common_template_errors.py

      - name: Commit guarded transcript-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts
          git rm tools/_tmp_refine_common_template_errors.py .github/workflows/zz-tmp-refine-common-template-errors.yml
          git status --short
          git commit -m "Refine common transcript fixes with name guards"
          git push origin HEAD:codex/fix-common-template-transcript-errors-20260823
